<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>कविता सागर | Hindi Poetry Reader</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#78350F" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Martel:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans Devanagari', sans-serif; -webkit-tap-highlight-color: transparent; }
    .font-kavita-title { font-family: 'Rozha One', serif; }
    .font-kavita-body { font-family: 'Martel', serif; }
  </style>
</head>
<body class="bg-[#FAF7F2] text-stone-900 min-h-screen select-none pb-12">

  <!-- ================= HOME VIEW ================= -->
  <div id="homeView" class="max-w-md mx-auto min-h-screen flex flex-col">
    <!-- Header -->
    <header class="p-4 bg-[#FAF7F2] sticky top-0 z-20 flex justify-between items-center border-b border-stone-200/60">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🪶</span>
        <h1 class="text-2xl font-bold font-kavita-title text-amber-900 tracking-wide">कविता सागर</h1>
      </div>
      <button id="refreshBtn" class="text-xs bg-amber-100/80 text-amber-900 px-3 py-1.5 rounded-full font-medium">
        ↻ ताज़ा करें
      </button>
    </header>

    <!-- Search Bar -->
    <div class="px-4 py-2">
      <div class="relative">
        <input type="text" id="searchInput" placeholder="शीर्षक या कवि खोजें..." 
               class="w-full bg-white pl-10 pr-4 py-2.5 rounded-2xl text-sm border border-stone-200 outline-none focus:ring-2 focus:ring-amber-800 shadow-sm" />
        <span class="absolute left-3.5 top-3 text-stone-400 text-sm">🔍</span>
      </div>
    </div>

    <!-- Category Chips Bar -->
    <div class="px-4 py-2 overflow-x-auto flex gap-2 no-scrollbar">
      <button class="cat-chip px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-amber-900 text-white" data-cat="सभी">सभी</button>
      <button class="cat-chip px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-white text-stone-700 border border-stone-200" data-cat="वीर रस">वीर रस</button>
      <button class="cat-chip px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-white text-stone-700 border border-stone-200" data-cat="प्रेम">प्रेम</button>
      <button class="cat-chip px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-white text-stone-700 border border-stone-200" data-cat="भक्ति">भक्ति रस</button>
      <button class="cat-chip px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-white text-stone-700 border border-stone-200" data-cat="प्रकृति">प्रकृति</button>
      <button class="cat-chip px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-white text-stone-700 border border-stone-200" data-cat="जीवन और दर्शन">जीवन और दर्शन</button>
    </div>

    <!-- Feed Container -->
    <main id="poemsContainer" class="p-4 space-y-4 flex-1">
      <!-- Dynamically filled -->
    </main>
  </div>

  <!-- ================= READER VIEW ================= -->
  <div id="readerView" class="hidden fixed inset-0 z-50 bg-[#FBF8F2] overflow-y-auto transition-colors duration-200 flex flex-col">
    
    <!-- Reader Top Bar -->
    <div id="readerAppBar" class="p-4 flex justify-between items-center sticky top-0 z-30 transition-opacity duration-200 bg-inherit border-b border-stone-200/50">
      <button id="backBtn" class="flex items-center gap-1 text-sm font-semibold">
        <span class="text-lg">←</span> वापस
      </button>
      <div class="flex items-center gap-3">
        <button id="settingsBtn" title="फॉन्ट और थीम" class="p-2 rounded-xl bg-black/5 hover:bg-black/10 text-base">
          Aa
        </button>
        <button id="shareBtn" title="साझा करें" class="p-2 rounded-xl bg-black/5 hover:bg-black/10 text-base">
          ↗
        </button>
        <button id="distractionBtn" title="शांत वाचन मोड" class="p-2 rounded-xl bg-black/5 hover:bg-black/10 text-base">
          ⛶
        </button>
      </div>
    </div>

    <!-- Reader Content -->
    <div id="readerContentArea" class="max-w-md mx-auto p-6 flex-1 flex flex-col items-center text-center">
      <span id="rCategory" class="text-xs uppercase tracking-wider font-semibold opacity-70 px-3 py-1 rounded-full bg-black/5 mb-3">
        श्रेणी
      </span>
      <h2 id="rTitle" class="text-2xl md:text-3xl font-bold font-kavita-title mb-2 leading-snug">
        कविता शीर्षक
      </h2>
      <p id="rPoet" class="text-sm italic opacity-80 mb-6">
        — कवि का नाम
      </p>

      <div class="text-stone-400 text-sm mb-6 select-none">❖ ❖ ❖</div>

      <div id="rBody" class="font-kavita-body whitespace-pre-wrap leading-[2.1] text-lg select-text text-center w-full">
        कविता का पाठ...
      </div>

      <div class="h-24"></div>
    </div>
  </div>

  <!-- Settings Bottom Sheet -->
  <div id="settingsSheet" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-end">
    <div class="bg-white w-full max-w-md mx-auto p-6 rounded-t-3xl shadow-2xl space-y-5">
      <div class="flex justify-between items-center pb-2 border-b">
        <h3 class="font-bold text-base">वाचन सेटिंग्स (Settings)</h3>
        <button id="closeSettings" class="text-xl font-bold">&times;</button>
      </div>

      <!-- Font Size Slider -->
      <div>
        <label class="text-xs font-semibold text-stone-600 block mb-2">फ़ॉन्ट आकार (Font Size)</label>
        <div class="flex items-center gap-3">
          <span class="text-xs font-bold">अ</span>
          <input type="range" id="fontSizeSlider" min="15" max="30" value="19" class="w-full accent-amber-900" />
          <span class="text-xl font-bold">अ</span>
        </div>
      </div>

      <!-- Reading Theme -->
      <div>
        <label class="text-xs font-semibold text-stone-600 block mb-2">पृष्ठभूमि थीम (Theme)</label>
        <div class="grid grid-cols-3 gap-2">
          <button class="theme-btn py-2 text-xs font-semibold rounded-xl border border-amber-900/40 bg-[#FBF8F2] text-stone-900" data-bg="#FBF8F2" data-text="#2E241E">भोजपत्र</button>
          <button class="theme-btn py-2 text-xs font-semibold rounded-xl border border-stone-200 bg-white text-stone-900" data-bg="#FFFFFF" data-text="#1A1A1A">धवल (White)</button>
          <button class="theme-btn py-2 text-xs font-semibold rounded-xl border border-stone-700 bg-[#18181B] text-stone-100" data-bg="#18181B" data-text="#E4E4E7">रात्रि (Dark)</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Offline fallback data (Dinkar, Bachchan, Kabir)
    const seedPoems = [
      {
        id: "kavita_rashmirathi_01",
        title: "कृष्ण की चेतावनी (रश्मिरथी)",
        poet_name: "रामधारी सिंह 'दिनकर'",
        category: "वीर रस",
        estimated_reading_minutes: 2,
        body: "वर्षों तक वन में घूम-घूम,\nबाधा-विघ्नों को चूम-चूम,\nसह धूप-घाम, पानी-पत्थर,\nपांडव आये कुछ और निखर।\nसौभाग्य न सब दिन सोता है,\nदेखें, आगे क्या होता है।\n\n'दो न्याय अगर तो आधा दो,\nपर, इसमें भी यदि बाधा हो,\nतो दे दो केवल पाँच ग्राम,\nरक्खो अपनी धरती तमाम।\nहम वहीं खुशी से खायेंगे,\nपरिजन पर असि न उठायेंगे!\n\nदुर्योधन वह भी दे न सका,\nआशीष समाज की ले न सका,\nउलटे, हरि को बाँधने चला,\nजो था असाध्य, साधने चला।\nजब नाश मनुज पर छाता है,\nपहले विवेक मर जाता है।"
      },
      {
        id: "kavita_madhushala_01",
        title: "मधुशाला",
        poet_name: "हरिवंश राय बच्चन",
        category: "जीवन और दर्शन",
        estimated_reading_minutes: 1,
        body: "मृदु भावों के अंगूरों की आज बना लाया हाला,\nप्रियतम, अपने ही हाथों से आज पिलाऊँगा प्याला,\n\nपहले भोग लगा लूँ तेरा फिर प्रसाद जग पाएगा,\nसबसे पहले तेरा स्वागत करती मेरी मधुशाला।\n\nएक तरह का पीनेवाला, एक तरह की पीती हाला,\nएक तरह का प्याला सबके हाथों में देती हाला,\nभेदभाव को दूर भगाकर सबको एक बनाती जाती,\nमेरी सुंदर मधुशाला।"
      },
      {
        id: "kavita_kabir_saakhi_01",
        title: "साखी - गुरु महिमा",
        poet_name: "कबीर दास",
        category: "भक्ति",
        estimated_reading_minutes: 1,
        body: "गुरु गोविंद दोऊ खड़े, काके लागूं पाँय।\nबलिहारी गुरु आपने, गोविंद दियो बताय॥\n\nपोथी पढ़ि पढ़ि जग मुआ, पंडित भया न कोय।\nढाई आखर प्रेम का, पढ़े सो पंडित होय॥\n\nसाधु ऐसा चाहिए, जैसा सूप सुभाय।\nसार-सार को गहि रहै, थोथा देई उड़ाय॥"
      }
    ];

    let poems = [];
    let activeCategory = 'सभी';
    let searchQuery = '';
    let currentPoem = null;

    // Load data from LocalStorage (or live Firestore if configured)
    function loadData() {
      const local = localStorage.getItem('kavita_poems_local');
      if (local) {
        try {
          const parsed = JSON.parse(local);
          poems = parsed.filter(p => p.is_published !== false);
        } catch (_) {
          poems = seedPoems;
        }
      } else {
        poems = seedPoems;
      }
      renderFeed();
    }

    // Render feed cards
    function renderFeed() {
      const container = document.getElementById('poemsContainer');
      const filtered = poems.filter(p => {
        const matchCat = activeCategory === 'सभी' || p.category === activeCategory;
        const matchSearch = !searchQuery || 
          p.title.toLowerCase().includes(searchQuery) || 
          p.poet_name.toLowerCase().includes(searchQuery);
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 text-stone-400">
            <div class="text-4xl mb-2">📜</div>
            <p class="text-sm font-medium">कोई कविता नहीं मिली</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(p => `
        <div onclick="openReader('${p.id}')" class="bg-white p-5 rounded-2xl shadow-sm border border-stone-200/80 active:scale-[0.99] transition cursor-pointer">
          <div class="flex justify-between items-center mb-2">
            <span class="text-[11px] font-bold text-amber-900 bg-amber-50 px-2.5 py-0.5 rounded-full">${p.category}</span>
            <span class="text-xs text-stone-400">~${p.estimated_reading_minutes || 2} मि. पाठ</span>
          </div>
          <h3 class="text-xl font-bold font-kavita-title text-stone-900 mb-1">${p.title}</h3>
          <p class="text-xs text-stone-500 italic mb-3">— ${p.poet_name}</p>
          <p class="font-kavita-body text-xs text-stone-700 line-clamp-2 leading-relaxed opacity-90">${p.body}</p>
        </div>
      `).join('');
    }

    // Open reader
    window.openReader = function(id) {
      currentPoem = poems.find(p => p.id === id);
      if (!currentPoem) return;

      document.getElementById('rCategory').textContent = currentPoem.category;
      document.getElementById('rTitle').textContent = currentPoem.title;
      document.getElementById('rPoet').textContent = `— ${currentPoem.poet_name}`;
      document.getElementById('rBody').textContent = currentPoem.body;

      document.getElementById('readerView').classList.remove('hidden');
      document.getElementById('readerView').scrollTop = 0;
    };

    // Back to feed
    document.getElementById('backBtn').addEventListener('click', () => {
      document.getElementById('readerView').classList.add('hidden');
    });

    // Category chip switching
    document.querySelectorAll('.cat-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-chip').forEach(b => {
          b.className = 'cat-chip px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-white text-stone-700 border border-stone-200';
        });
        btn.className = 'cat-chip px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-amber-900 text-white';
        activeCategory = btn.getAttribute('data-cat');
        renderFeed();
      });
    });

    // Search query
    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderFeed();
    });

    // Typography Settings modal
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsSheet = document.getElementById('settingsSheet');
    const closeSettings = document.getElementById('closeSettings');
    const fontSizeSlider = document.getElementById('fontSizeSlider');
    const rBody = document.getElementById('rBody');
    const readerView = document.getElementById('readerView');

    settingsBtn.addEventListener('click', () => settingsSheet.classList.remove('hidden'));
    closeSettings.addEventListener('click', () => settingsSheet.classList.add('hidden'));

    fontSizeSlider.addEventListener('input', (e) => {
      rBody.style.fontSize = `${e.target.value}px`;
    });

    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const bg = btn.getAttribute('data-bg');
        const text = btn.getAttribute('data-text');
        readerView.style.backgroundColor = bg;
        readerView.style.color = text;
        settingsSheet.classList.add('hidden');
      });
    });

    // Distraction free toggle
    let distraction = false;
    const readerAppBar = document.getElementById('readerAppBar');
    document.getElementById('distractionBtn').addEventListener('click', () => {
      distraction = true;
      readerAppBar.classList.add('opacity-0', 'pointer-events-none');
    });

    readerView.addEventListener('click', (e) => {
      if (distraction && !e.target.closest('#readerAppBar')) {
        distraction = false;
        readerAppBar.classList.remove('opacity-0', 'pointer-events-none');
      }
    });

    // Share poem
    document.getElementById('shareBtn').addEventListener('click', () => {
      if (!currentPoem) return;
      const text = `${currentPoem.title}\n— ${currentPoem.poet_name}\n\n${currentPoem.body}`;
      if (navigator.share) {
        navigator.share({ title: currentPoem.title, text });
      } else {
        navigator.clipboard.writeText(text);
        alert('कविता कॉपी कर ली गई है!');
      }
    });

    document.getElementById('refreshBtn').addEventListener('click', loadData);

    // Register PWA service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    // Init
    loadData();
  </script>
</body>
</html>
